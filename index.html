    let currentLifecycle = 'all';
    let currentAsset = 'all';
    let clickStats = JSON.parse(localStorage.getItem('clickStats')) || {};

    const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_YOUR_SCRIPT_ID/exec"; 

    // 直接啟動主程式，不再檢查 currentUser
    window.onload = () => {
        allCases = data_all;
        allCases.forEach((c, idx) => c.id = 'case_' + idx);
        showMainApp();
    };

    function showMainApp() {
        // 主畫面預設就是顯示狀態，這裡可確保介面更新
        document.getElementById('main-app').style.display = 'block';
        updateHotSection();
        renderCases();
    }

    function sendTrafficLog(action, details) {
        if(GOOGLE_APP_SCRIPT_URL.includes("YOUR_SCRIPT_ID")) return;
        fetch(GOOGLE_APP_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: "Guest", action: action, details: details, time: new Date().toLocaleString() })
        }).catch(e => console.log('Log Error', e));
    }

    function toggleDrawer(type) {
        document.getElementById('drawer-lc').style.display = 'none';
        document.getElementById('drawer-as').style.display = 'none';
        document.getElementById('tab-lc').classList.remove('active');
        document.getElementById('tab-as').classList.remove('active');

        document.getElementById('drawer-' + type).style.display = 'block';
        document.getElementById('tab-' + type).classList.add('active');
    }

    function setFilter(type, val) {
        if(type === 'lc') currentLifecycle = val;
        if(type === 'as') currentAsset = val;
        
        document.querySelectorAll(`#drawer-${type} .filter-btn`).forEach(b => {
            b.classList.remove('active');
            if(b.innerText.includes(val) || (val==='all' && b.innerText==='全部')) b.classList.add('active');
        });
        document.getElementById('drawer-' + type).style.display = 'none';
        renderCases();
    }

    function renderCases() {
        const container = document.getElementById('cases-container');
        container.innerHTML = '';

        const filtered = allCases.filter(c => 
            (currentLifecycle === 'all' || c.lifecycle === currentLifecycle) &&
            (currentAsset === 'all' || c.asset === currentAsset)
        );

        if(filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">此分類目前無資料</div>';
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openCaseModal(item);
            card.innerHTML = `
                <div class="tags">
                    <span class="tag tag-lc">${item.lifecycle}</span>
                    <span class="tag tag-as">${item.asset}</span>
                </div>
                <h3 class="card-title">${item.title}</h3>
                <div class="card-quote">💡 ${item.quote || '掌握最新稅務趨勢'}</div>
                <p class="click-hint">點擊展開詳情 ➜</p>
            `;
            container.appendChild(card);
        });
    }

    function updateHotSection() {
        const sorted = [...allCases].sort((a,b) => (clickStats[b.id]||0) - (clickStats[a.id]||0));
        const topCase = sorted;
        if(topCase && clickStats[topCase.id] > 0) {
            document.getElementById('hot-section').innerHTML = `<span class="hot-badge">今日熱門</span> ${topCase.title} (點閱: ${clickStats[topCase.id]})`;
        } else {
            document.getElementById('hot-section').innerHTML = `<span class="hot-badge">最新上架</span> ${allCases?.title || '尚無資料'}`;
        }
    }

    function openCaseModal(item) {
        clickStats[item.id] = (clickStats[item.id] || 0) + 1;
        localStorage.setItem('clickStats', JSON.stringify(clickStats));
        updateHotSection();
        sendTrafficLog("View_Case", item.title);

        const maxVal = Math.max(item.visual?.bad_val || 1, item.visual?.good_val || 1);
        const badPct = ((item.visual?.bad_val || 0) / maxVal) * 100;
        const goodPct = ((item.visual?.good_val || 0) / maxVal) * 100;

        const body = document.getElementById('modal-content-body');
        body.innerHTML = `
            <div class="tags">
                <span class="tag tag-lc">${item.lifecycle}</span>
                <span class="tag tag-as">${item.asset}</span>
            </div>
            <h2 style="color:var(--primary); margin: 5px 0 10px;">${item.title}</h2>
            <div style="font-size:0.95rem; color:var(--danger); font-weight:bold; margin-bottom:15px; background:#FEF2F2; padding:10px; border-radius:8px;">💡 ${item.quote || ''}</div>
            
            <div class="section-block">
                <div class="level-title">📖 破冰故事</div>
                <div class="content-box" style="border-left:4px solid #94A3B8;">${item.layer1_story || ''}</div>
            </div>
            <div class="section-block">
                <div class="level-title">⚠️ 點出盲點</div>
                <div class="content-box" style="border-left:4px solid var(--danger); background:#FFF5F5; color:#B91C1C;">${item.layer2_blindSpot || ''}</div>
            </div>
            
            <div class="chart-wrap">
                <div class="bar-row">
                    <div class="bar-title"><span style="color:var(--danger)">❌ ${item.visual?.bad_label || '踩雷代價'}</span> <span>${item.visual?.bad_val || 0}</span></div>
                    <div class="bar-track"><div class="bar-fill" style="width: ${badPct}%; background:var(--danger);"></div></div>
                </div>
                <div class="bar-row">
                    <div class="bar-title"><span style="color:var(--success)">✅ ${item.visual?.good_label || '妥善規劃'}</span> <span>${item.visual?.good_val || 0}</span></div>
                    <div class="bar-track"><div class="bar-fill" style="width: ${goodPct}%; background:var(--success);"></div></div>
                </div>
            </div>

            <div class="section-block">
                <div class="level-title">🗣️ 三分鐘話術</div>
                <div class="script-box" id="script-${item.id}">${item.layer3_script || ''}</div>
            </div>
            <div class="section-block">
                <div class="level-title">🛡️ 引導解方 (守門員)</div>
                <div class="content-box" style="border-left:4px solid var(--success); background:#F0FDF4; color:#15803D;">${item.layer4_solution || ''}</div>
            </div>
        `;

        const footer = document.getElementById('modal-footer-btns');
        let linkBtn = item.link ? `<button class="action-btn btn-link" onclick="window.open('${item.link}', '_blank'); sendTrafficLog('Click_Link', '${item.title}')">🔗 閱讀原文</button>` : '';
        footer.innerHTML = `
            ${linkBtn}
            <button class="action-btn btn-copy" onclick="copyScript('${item.id}')">📋 複製話術</button>
            <button class="action-btn btn-close" onclick="closeModal()">✖️ 關閉</button>
        `;

        document.getElementById('case-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('case-modal').style.display = 'none';
    }

    function copyScript(id) {
        const text = document.getElementById('script-' + id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('話術已成功複製！可以貼給客戶囉！');
            sendTrafficLog("Copy_Script", "Copied script for " + id);
        }).catch(err => {
            alert('複製失敗，請手動選取複製');
        });
    }
    </script>
</body>
