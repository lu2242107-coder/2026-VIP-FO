    let currentAsset = 'all';
    
    window.onload = () => {
        data_all.forEach((c, idx) => c.id = 'case_' + idx);
        document.getElementById('searchInput').addEventListener('input', renderCases);
        updateButtonCounts();
        renderCases();
    };

    function setFilter(type, val) {
        if(type === 'lc') {
            currentLifecycle = val;
            currentAsset = 'all';
            document.querySelectorAll('#drawer-as .filter-btn').forEach(b => {
                b.classList.remove('active');
                if(b.dataset.val === 'all') b.classList.add('active');
            });
        }
        if(type === 'as') {
            currentAsset = val;
            currentLifecycle = 'all';
            document.querySelectorAll('#drawer-lc .filter-btn').forEach(b => {
                b.classList.remove('active');
                if(b.dataset.val === 'all') b.classList.add('active');
            });
        }
        
        document.querySelectorAll(`#drawer-${type} .filter-btn`).forEach(b => {
            b.classList.remove('active');
            if(b.dataset.val === val) {
                b.classList.add('active');
                b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        });
        
        renderCases();
    }

    function renderCases() {
        const container = document.getElementById('cases-container');
        container.innerHTML = '';
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        const filtered = data_all.filter(c => {
            const matchLife = currentLifecycle === 'all' || c.lifecycle === currentLifecycle;
            const matchAsset = currentAsset === 'all' || c.asset === currentAsset;
            const matchQuery = !query || c.title.toLowerCase().includes(query) || (c.quote && c.quote.toLowerCase().includes(query));
            return matchLife && matchAsset && matchQuery;
        });

        if(filtered.length === 0) {
            container.innerHTML = '<div class="empty-state"><span>🔍</span>找不到相符的案例，換個分類或關鍵字試試看！</div>';
            return;
        }

        filtered.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card fade-in';
            card.style.animationDelay = `${index * 0.04}s`;
            card.onclick = () => openCaseModal(item);
            
            const sticker = getSticker(item.asset);

            card.innerHTML = `
                <div class="card-sticker">${sticker}</div>
                <div class="tags">
                    <span class="tag tag-lc">${item.lifecycle}</span>
                    <span class="tag tag-as">${item.asset}</span>
                </div>
                <h3 class="card-title">${item.title}</h3>
                <div class="card-quote">💡 ${item.quote || '掌握稅務趨勢'}</div>
            `;
            container.appendChild(card);
        });
    }

    function openCaseModal(item) {
        const maxVal = Math.max(item.visual?.bad_val || 1, item.visual?.good_val || 1);
        const badPct = ((item.visual?.bad_val || 0) / maxVal) * 100;
        const goodPct = ((item.visual?.good_val || 0) / maxVal) * 100;

        document.getElementById('modal-content-body').innerHTML = `
            <div class="tags" style="margin-bottom:15px;">
                <span class="tag tag-lc">${item.lifecycle}</span>
                <span class="tag tag-as">${item.asset}</span>
            </div>
            <h2 style="margin: 5px 0 15px; font-weight: 900; line-height: 1.45;">${item.title}</h2>
            <div style="font-size:0.95rem; color:var(--danger); font-weight:bold; margin-bottom:24px; background:#FEF2F2; padding:14px 18px; border-radius:12px; border-left: 4px solid var(--danger);">💡 ${item.quote}</div>
            
            <div class="section-block">
                <div class="level-title">📖 破冰故事</div>
                <div class="content-box">${item.layer1_story}</div>
            </div>
            <div class="section-block">
                <div class="level-title">⚠️ 點出盲點</div>
                <div class="content-box" style="background:#FFF5F5; color:#B91C1C;">${item.layer2_blindSpot}</div>
            </div>
            <div class="chart-wrap">
                <div class="bar-row">
                    <div class="bar-title"><span style="color:var(--danger)">❌ ${item.visual.bad_label}</span> <span style="color:var(--danger)">${item.visual.bad_val}</span></div>
                    <div class="bar-track"><div class="bar-fill" style="width: ${badPct}%; background:linear-gradient(90deg, #FF6B6B, #FF8E8E);"></div></div>
                </div>
                <div class="bar-row">
                    <div class="bar-title"><span style="color:var(--success)">✅ ${item.visual.good_label}</span> <span style="color:var(--success)">${item.visual.good_val}</span></div>
                    <div class="bar-track"><div class="bar-fill" style="width: ${goodPct}%; background:linear-gradient(90deg, #2ECC71, #58D68D);"></div></div>
                </div>
            </div>
            <div class="section-block">
                <div class="level-title">🗣️ 三分鐘話術</div>
                <div class="script-box" id="script-${item.id}">${item.layer3_script}</div>
            </div>
            <div class="section-block">
                <div class="level-title">🛡️ 引導解方 (守門員)</div>
                <div class="content-box" style="background:#F0FDF4; color:#15803D;">${item.layer4_solution}</div>
            </div>
        `;

        let linkBtnHTML = '';
        if (item.link && item.link.trim() !== "") {
            linkBtnHTML = `<button class="action-btn btn-link" onclick="window.open('${item.link}', '_blank')">🔗 來源網址</button>`;
        }

        document.getElementById('modal-footer-btns').innerHTML = `
            ${linkBtnHTML}
            <button class="action-btn btn-copy" onclick="copyScript('${item.id}')">📋 複製話術</button>
            <button class="action-btn btn-close" onclick="closeModal()">✖️ 關閉</button>
        `;

        document.getElementById('case-modal').style.display = 'block';
    }

    function closeModal() { document.getElementById('case-modal').style.display = 'none'; }
    function copyScript(id) {
        navigator.clipboard.writeText(document.getElementById('script-' + id).innerText)
            .then(() => alert('✅ 話術已成功複製！'))
            .catch(() => alert('❌ 複製失敗，請手動複製'));
    }
    window.onclick = function(e) { if (e.target == document.getElementById('case-modal')) closeModal(); }
    </script>
</body>
</html>
